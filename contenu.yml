#  et colle-le juste en dessous, au même niveau d'espaces.
#
#  Champs d'un projet :
#    titre   : nom du projet
#    client  : client ou contexte
#    roles   : ce que tu as fait, entre crochets, séparé par des virgules
#    lien    : lien YouTube ou Instagram (vide = carte non cliquable)
#    image   : chemin vers une image dans le dossier images/projets/
#              (vide + lien YouTube = miniature YouTube automatique)
#
#  Le premier projet de la liste s'affiche en premier.
